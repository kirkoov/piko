<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title data-i18n="appTitle">Piko</title>
    <link rel="stylesheet" href="style.css" />
    <link
      rel="icon"
      type="image/png"
      href="/assets/manifest/favicon-96x96.png"
      sizes="96x96"
    />
    <link rel="icon" type="image/svg+xml" href="/assets/manifest/favicon.svg" />
    <link rel="shortcut icon" href="/assets/manifest/favicon.ico" />
    <link
      rel="apple-touch-icon"
      sizes="180x180"
      href="/assets/manifest/apple-touch-icon.png"
    />
    <link rel="manifest" href="/assets/manifest/site.webmanifest" />
  </head>

  <body>
    <h1>Piko</h1>

    <div class="login-card">
      <label for="username">Username</label><br />
      <input id="username" type="text" />

      <br /><br />

      <label for="password">Password</label><br />
      <input id="password" type="password" />

      <br /><br />

      <button id="login-btn">
        <span class="btn-icon"></span>
      </button>

      <p id="login-error"></p>
    </div>

    <script type="module" src="js/login.js"></script>
  </body>
</html>
