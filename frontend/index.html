<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title data-i18n="appTitle">Piko</title>
    <link rel="stylesheet" href="style.css" />
    <link rel="icon" type="image/png" href="/favicon-96x96.png" sizes="96x96" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="shortcut icon" href="/favicon.ico" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
  </head>
  <body>
    <h1 data-i18n="appTitle">Piko App 0.1</h1>
    <select id="language">
      <option value="ru">русский</option>
      <option value="fi">Suomi</option>
      <option value="en">English</option>
    </select>

    <h2 id="period-title" data-i18n="currentPeriod">Period</h2>
    <div id="period"></div>

    <button id="toggle-shifts" data-i18n="showAllShifts">
      Show all shifts
    </button>

    <h2 data-i18n="balance">Balance</h2>
    <div id="balance"></div>

    <h2 data-i18n="shifts">Shifts</h2>
    <div id="shifts"></div>

    <button id="add-shift-btn" data-i18n="addShift">Add Shift</button>

    <div id="modal" class="modal" style="display: none">
      <div class="modal-content">
        <h2 id="modal_title">Shift</h2>

        <label for="m_date">Date</label><br />
        <input type="date" id="m_date" />
        <br /><br />

        <label for="m_planned">Planned shift (HH:MM-HH:MM)</label><br />
        <input id="m_planned" type="text" />
        <br /><br />

        <label for="m_actual">Actual shift (HH:MM-HH:MM)</label><br />
        <input id="m_actual" type="text" />
        <br /><br />

        <label for="m_latest_child_name">Latest child name</label><br />
        <input id="m_latest_child_name" type="text" />
        <br /><br />

        <label for="m_latest_child_time"
          >Latest child leaving time (HH:MM)</label
        ><br />
        <input id="m_latest_child_time" type="text" />
        <br /><br />

        <label for="m_note">Note</label><br />
        <input id="m_note" type="text" />
        <br /><br />

        <button id="save-btn" data-i18n="save">Save</button>
        <button id="cancel-btn" data-i18n="cancel">Cancel</button>
      </div>
    </div>
    <script src="translations.js"></script>
    <script type="module" src="app.js"></script>
  </body>
</html>
